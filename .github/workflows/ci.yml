name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Callable so the publish pipeline can hard-gate a release on the same checks.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; main and release runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json `engines`; 24 is what the
        # publish job builds with. Both are tested so the engines claim is real.
        node: ['20', '24']

    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager`, which also pins
      # Dependabot's pnpm so its lockfile updates keep the `overrides` block.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
